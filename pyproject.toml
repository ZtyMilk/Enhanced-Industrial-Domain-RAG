[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "faiss-cpu>=1.15.0",
    "flagembedding>=1.4.2",
    "numpy<=2.5.2",
    "openai>=3.17.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]

[project.scripts]
project = "project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124" },
]
torchvision = [
  { index = "pytorch-cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true